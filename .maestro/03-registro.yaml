appId: app.clara.ios
name: Daily check-in shows up on the timeline
tags: [smoke]
---
- launchApp:
    clearState: true
    arguments:
      "-ui-testing": true
- tapOn: "Registros"
- tapOn:
    id: "records.checkIn"
- tapOn:
    id: "mood.good"
- tapOn:
    id: "momentForm.save"
- assertVisible:
    id: "records.row"
