# Dependency updates arrive as PRs and go through CI like any other code.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
    # Waits until a version is 14 days old before proposing it (lowers the risk of a compromised release).
    cooldown:
      default-days: 14

  - package-ecosystem: swift
    directory: /Packages/ClaraKit
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 14

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 14
