# Project generated with XcodeGen: `xcodegen generate` creates Clara.xcodeproj.
# The .xcodeproj stays out of git, so there are no merge conflicts in project.pbxproj,
# a classic problem in large teams.
name: Clara
options:
  bundleIdPrefix: app.clara
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Needed for the SwiftLint script to read the project files.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  ClaraKit:
    path: Packages/ClaraKit

targets:
  Clara:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ClaraKit
        products:
          - ClaraCore
          - ClaraInfrastructure
          - ClaraUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Clara
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: pt-BR
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.clara.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --quiet
          else
            echo "warning: SwiftLint is not installed (brew install swiftlint)"
          fi

  ClaraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: Clara
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.clara.ios.uitests
        TEST_TARGET_NAME: Clara

schemes:
  Clara:
    build:
      targets:
        Clara: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Clara
        - package: ClaraKit/ClaraCore
        - package: ClaraKit/ClaraInfrastructure
        - package: ClaraKit/ClaraUI
      targets:
        - ClaraUITests
        - package: ClaraKit/ClaraCoreTests
        - package: ClaraKit/ClaraStorageTests
        - package: ClaraKit/ClaraNetworkingTests
        - package: ClaraKit/ClaraServicesTests
        - package: ClaraKit/ClaraAITests
        - package: ClaraKit/TodayFeatureTests
        - package: ClaraKit/RecordsFeatureTests
        - package: ClaraKit/ConsultationFeatureTests
        - package: ClaraKit/SnapshotTests
    profile:
      config: Release
    archive:
      config: Release
