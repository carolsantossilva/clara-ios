# Main pipeline. The main branch rule requires the "CI OK" job, which only passes
# when every other job passed (or was skipped because it does not apply).
#
# Security of the pipeline itself:
# - Actions pinned by commit SHA (a tag can be moved); Dependabot updates them.
# - Read-only GITHUB_TOKEN; checkout without persisted credentials.
# - Tools downloaded at a pinned version with a checksum (scripts/ci/install-tools.sh).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  detect:
    name: Detect what exists
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.detect.outputs.app }}
      package: ${{ steps.detect.outputs.package }}
      maestro: ${{ steps.detect.outputs.maestro }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        run: |
          echo "app=$([[ -f project.yml ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "package=$([[ -f Packages/ClaraKit/Package.swift ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "maestro=$(compgen -G '.maestro/*.yaml' >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"

  policy:
    name: Policies (dependencies, guardrails, suppressions, tests)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # On a PR, compare with the current state of the base branch, looked up through
      # the API: in stacked PRs the SHA stored in the event goes stale (base and PR are
      # updated together) and github.base_ref points to main, not to the PR below.
      - name: Find the base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            BASE_REF=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .base.ref)
            echo "BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
          else
            echo "BASE=$BEFORE" >> "$GITHUB_ENV"
          fi
      - name: Guardrail regression tests
        run: python3 -B -m unittest discover -s scripts/guardrails/tests -v
      - name: Check policies
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'push' }}
        run: |
          echo "Comparing with $BASE"
          python3 scripts/guardrails/policy_check.py --mode "$MODE" --base "$BASE"

  secrets:
    name: Secrets (full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/ci/install-tools.sh gitleaks
      - run: gitleaks git --redact --no-banner --verbose .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only

  lint:
    name: SwiftLint
    needs: detect
    if: needs.detect.outputs.app == 'true' || needs.detect.outputs.package == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/install-tools.sh swiftlint
      - run: swiftlint lint --strict --reporter github-actions-logging

  test:
    name: Build and tests (unit, snapshot, UI) + coverage
    needs: [detect, lint]
    if: needs.detect.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/install-tools.sh xcodegen swiftlint
      - run: xcodegen generate
      - name: Tests
        run: |
          set -o pipefail
          UDID=$(scripts/ci/simulator.sh)
          mkdir -p build
          xcodebuild test \
            -project Clara.xcodeproj -scheme Clara \
            -destination "id=$UDID" \
            -derivedDataPath build/dd \
            -resultBundlePath build/Tests.xcresult \
            -enableCodeCoverage YES \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO | tee build/xcodebuild.log
      # Compiler warnings fail the build: AI-generated code does not get in with warnings.
      - name: No compiler warnings
        run: scripts/ci/no_warnings.sh build/xcodebuild.log
      - name: Minimum coverage
        run: python3 scripts/ci/coverage_gate.py build/Tests.xcresult
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results
          path: build/Tests.xcresult
          retention-days: 7
      # A snapshot without a reference (or a different one) records the new image and fails.
      # The images become an artifact for a person to check and commit.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: snapshots
          path: Packages/ClaraKit/Tests/SnapshotTests/__Snapshots__
          if-no-files-found: ignore
          retention-days: 7

  # While the app (project.yml) does not exist, test only the package. Allows small
  # stacked PRs: each module comes in built and tested.
  package:
    name: Package build and tests + coverage
    needs: [detect, lint]
    if: needs.detect.outputs.package == 'true' && needs.detect.outputs.app != 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Watchdog: build + tests take about 4 minutes. Past 12, a test is stuck; before
      # killing it, record every thread stack of the test processes (sample), so the
      # log shows where it hung instead of only "The operation was canceled".
      - name: Tests
        working-directory: Packages/ClaraKit
        run: |
          UDID=$("$GITHUB_WORKSPACE/scripts/ci/simulator.sh")
          mkdir -p "$GITHUB_WORKSPACE/build"
          (
            set -o pipefail
            xcodebuild test \
              -scheme ClaraKit-Package \
              -destination "id=$UDID" \
              -derivedDataPath "$GITHUB_WORKSPACE/build/dd" \
              -resultBundlePath "$GITHUB_WORKSPACE/build/Tests.xcresult" \
              -enableCodeCoverage YES \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO | tee "$GITHUB_WORKSPACE/build/xcodebuild.log"
          ) &
          tests=$!
          for _ in $(seq 144); do
            kill -0 "$tests" 2>/dev/null || break
            sleep 5
          done
          if kill -0 "$tests" 2>/dev/null; then
            echo "::error::Tests did not finish in 12 minutes. Stacks of the test processes:"
            for pid in $(pgrep -x xctest); do
              sample "$pid" 3 -file "$GITHUB_WORKSPACE/build/sample-$pid.txt" >/dev/null 2>&1 || true
              cat "$GITHUB_WORKSPACE/build/sample-$pid.txt" || true
            done
            pkill -x xcodebuild || true
            exit 1
          fi
          wait "$tests"
      - name: No compiler warnings
        run: scripts/ci/no_warnings.sh build/xcodebuild.log
      - name: Minimum coverage
        run: python3 scripts/ci/coverage_gate.py build/Tests.xcresult
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: package-test-results
          path: |
            build/Tests.xcresult
            build/sample-*.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: package-snapshots
          path: Packages/ClaraKit/Tests/SnapshotTests/__Snapshots__
          if-no-files-found: ignore
          retention-days: 7

  maestro:
    name: End-to-end flows (Maestro)
    needs: [detect, lint]
    if: needs.detect.outputs.app == 'true' && needs.detect.outputs.maestro == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/install-tools.sh xcodegen maestro
      - run: xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          UDID=$(scripts/ci/simulator.sh)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild build \
            -project Clara.xcodeproj -scheme Clara \
            -destination "id=$UDID" \
            -derivedDataPath build/dd \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Run flows
        env:
          # The iOS driver sometimes takes longer than the 15 s default to start on the
          # shared runners ("iOS driver not ready in time"). Value in milliseconds.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/dd/Build/Products/Debug-iphonesimulator/Clara.app
          maestro --device "$UDID" test .maestro --format junit --output build/maestro.xml --test-output-dir build/maestro
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: maestro
          path: build/maestro
          retention-days: 7

  ci-ok:
    name: CI OK
    if: always()
    needs: [detect, policy, secrets, dependency-review, lint, test, package, maestro]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          [[ "$RESULTS" != *failure* && "$RESULTS" != *cancelled* ]]
