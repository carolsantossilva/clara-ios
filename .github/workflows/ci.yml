# Pipeline principal. A regra da branch main exige o job "CI OK", que só passa
# quando todos os outros passaram (ou foram pulados por não se aplicarem).
#
# Segurança do próprio pipeline:
# - Actions fixadas por SHA do commit (tag pode ser movida); o Dependabot atualiza.
# - GITHUB_TOKEN só com leitura; checkout sem persistir credenciais.
# - Ferramentas baixadas com versão fixa e checksum (scripts/ci/install-tools.sh).
name: CI
# Record the exact merge SHA and activity for safe reuse on label events.
run-name: CI / ${{ github.event.action || 'push' }} / ${{ github.sha }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Label edits must never cancel an in-progress code validation.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'workflow_dispatch' && 'manual' || (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'labels' || 'code' }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  detect:
    name: Detectar o que existe
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.detect.outputs.app }}
      package: ${{ steps.detect.outputs.package }}
      maestro: ${{ steps.detect.outputs.maestro }}
      maestro_mode: ${{ steps.detect.outputs.maestro_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          echo "app=$([[ -f project.yml ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "package=$([[ -f Packages/ClaraKit/Package.swift ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          mode=$(python3 scripts/ci/maestro_selection.py --event "$GITHUB_EVENT_NAME" --base "$BASE_SHA" --head "$GITHUB_SHA")
          echo "maestro_mode=$mode" >> "$GITHUB_OUTPUT"
          if compgen -G '.maestro/*.yaml' >/dev/null; then
            echo "maestro=true" >> "$GITHUB_OUTPUT"
          else
            echo "maestro=false" >> "$GITHUB_OUTPUT"
          fi

  policy:
    name: Políticas (dependências, guardrails, supressões, testes)
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guardrail regression tests
        run: python3 -B -m unittest discover -s scripts/guardrails/tests -v
      - name: Verificar políticas
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'push' }}
        run: |
          if [[ "$MODE" == push ]]; then BASE_SHA=HEAD; fi
          python3 scripts/ci/trusted_policy.py --mode "$MODE" --base "$BASE_SHA"

  secrets:
    name: Segredos (histórico inteiro)
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/ci/install-tools.sh gitleaks
      - run: gitleaks git --redact --no-banner --verbose .

  dependency-review:
    name: Revisão de dependências
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only

  lint:
    name: SwiftLint
    needs: detect
    if: (needs.detect.outputs.app == 'true' || needs.detect.outputs.package == 'true') && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: macos-26
    concurrency:
      group: macos-ci
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/install-tools.sh swiftlint
      - run: swiftlint lint --strict --reporter github-actions-logging

  test:
    name: Build e testes (unitários, snapshot, UI) + cobertura
    needs: [detect, lint]
    if: needs.detect.outputs.app == 'true' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: macos-26
    concurrency:
      group: macos-ci
      queue: max
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/install-tools.sh xcodegen swiftlint
      - run: xcodegen generate
      - name: Testes
        run: |
          set -o pipefail
          UDID=$(scripts/ci/simulator.sh)
          mkdir -p build
          xcodebuild test \
            -project Clara.xcodeproj -scheme Clara \
            -destination "id=$UDID" \
            -derivedDataPath build/dd \
            -resultBundlePath build/Testes.xcresult \
            -enableCodeCoverage YES \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO | tee build/xcodebuild.log
      # Avisos do compilador viram erro: código gerado por IA não entra com warning.
      - name: Sem avisos do compilador
        run: scripts/ci/no_warnings.sh build/xcodebuild.log
      - name: Cobertura mínima
        run: python3 scripts/ci/coverage_gate.py build/Testes.xcresult
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: resultado-dos-testes
          path: build/Testes.xcresult
          retention-days: 7
      # Snapshot sem referência (ou diferente) grava a imagem nova e falha.
      # As imagens viram artefato para uma pessoa conferir e commitar.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: snapshots
          path: Packages/ClaraKit/Tests/SnapshotTests/__Snapshots__
          if-no-files-found: ignore
          retention-days: 7

  # Enquanto o app (project.yml) não existe, testa só o pacote. Permite PRs
  # pequenos em pilha: cada módulo entra compilado e testado.
  package:
    name: Build e testes do pacote + cobertura
    needs: [detect, lint]
    if: needs.detect.outputs.package == 'true' && needs.detect.outputs.app != 'true' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: macos-26
    concurrency:
      group: macos-ci
      queue: max
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vigia: build + testes levam uns 4 minutos. Se passar de 12, algum teste travou;
      # antes de matar, grava a pilha de cada thread dos processos de teste (sample),
      # para o log mostrar onde travou em vez de só "The operation was canceled".
      - name: Testes
        working-directory: Packages/ClaraKit
        run: |
          UDID=$("$GITHUB_WORKSPACE/scripts/ci/simulator.sh")
          mkdir -p "$GITHUB_WORKSPACE/build"
          (
            set -o pipefail
            xcodebuild test \
              -scheme ClaraKit-Package \
              -destination "id=$UDID" \
              -derivedDataPath "$GITHUB_WORKSPACE/build/dd" \
              -resultBundlePath "$GITHUB_WORKSPACE/build/Testes.xcresult" \
              -enableCodeCoverage YES \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO | tee "$GITHUB_WORKSPACE/build/xcodebuild.log"
          ) &
          tests=$!
          for _ in $(seq 144); do
            kill -0 "$tests" 2>/dev/null || break
            sleep 5
          done
          if kill -0 "$tests" 2>/dev/null; then
            echo "::error::Os testes não terminaram em 12 minutos. Pilhas dos processos de teste:"
            for pid in $(pgrep -x xctest); do
              sample "$pid" 3 -file "$GITHUB_WORKSPACE/build/sample-$pid.txt" >/dev/null 2>&1 || true
              cat "$GITHUB_WORKSPACE/build/sample-$pid.txt" || true
            done
            pkill -x xcodebuild || true
            exit 1
          fi
          wait "$tests"
      - name: Sem avisos do compilador
        run: scripts/ci/no_warnings.sh build/xcodebuild.log
      - name: Cobertura mínima
        run: python3 scripts/ci/coverage_gate.py build/Testes.xcresult
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: resultado-dos-testes-do-pacote
          path: |
            build/Testes.xcresult
            build/sample-*.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: snapshots-do-pacote
          path: Packages/ClaraKit/Tests/SnapshotTests/__Snapshots__
          if-no-files-found: ignore
          retention-days: 7

  maestro:
    name: Fluxos de ponta a ponta (Maestro)
    needs: [detect, lint]
    if: needs.detect.outputs.app == 'true' && github.event.action != 'labeled' && github.event.action != 'unlabeled' && needs.detect.outputs.maestro == 'true' && needs.detect.outputs.maestro_mode != 'skip'
    runs-on: macos-26
    concurrency:
      group: macos-ci
      queue: max
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/install-tools.sh xcodegen maestro
      - run: xcodegen generate
      - name: Build para o simulador
        run: |
          set -o pipefail
          UDID=$(scripts/ci/simulator.sh)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild build \
            -project Clara.xcodeproj -scheme Clara \
            -destination "id=$UDID" \
            -derivedDataPath build/dd \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Rodar fluxos
        env:
          # O driver do iOS às vezes leva mais que os 15 s padrão para subir nos runners
          # compartilhados ("iOS driver not ready in time"). Valor em milissegundos.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/dd/Build/Products/Debug-iphonesimulator/Clara.app
          if [[ "${{ needs.detect.outputs.maestro_mode }}" == smoke ]]; then
            maestro --device "$UDID" test .maestro --exclude-tags=full --format junit --output build/maestro.xml --test-output-dir build/maestro
          else
            maestro --device "$UDID" test .maestro --format junit --output build/maestro.xml --test-output-dir build/maestro
          fi
      - name: Exigir ao menos um fluxo Maestro
        run: python3 scripts/ci/maestro_result_gate.py build/maestro.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: maestro
          path: build/maestro
          retention-days: 7

  code-validation:
    name: Validação do código
    if: always() && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    needs: [detect, lint, test, package, maestro]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exigir todos os testes aplicáveis
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/ci_gate.py code

  ci-ok:
    name: CI OK
    if: always()
    needs: [detect, policy, secrets, dependency-review, code-validation]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Testar a agregação do CI
        run: python3 -B -m unittest discover -s scripts/ci/tests -v
      - name: Exigir validação do código e políticas com labels atuais
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/ci_gate.py
