# Mutation testing (Muter): introduces bugs into the code on purpose and checks
# that some test fails. A surviving mutant = a test that covers the code but
# verifies nothing (a common problem in AI-written tests).
# It is slow: runs weekly and on demand, and does not block PRs. The report is
# kept as an artifact. Experimental: Muter has had no release since 2023.
name: Mutation

on:
  schedule:
    - cron: "13 8 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  muter:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/install-tools.sh xcodegen
      - run: xcodegen generate
      - name: Install Muter
        run: brew install muter-mutation-testing/formulae/muter
      - name: Run
        run: |
          mkdir -p build
          # Business rules only (ClaraCore): that is where a weak test costs the most.
          files=$(ls Packages/ClaraKit/Sources/ClaraCore/*.swift | paste -sd, -)
          muter run --skip-coverage --files-to-mutate "$files" --format html --output build/muter.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation
          path: build/muter.*
          retention-days: 30
