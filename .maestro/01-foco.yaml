appId: app.clara.ios
name: Create the first task and start focusing
tags: [smoke]
---
# -ui-testing: in-memory database and no network, so every flow starts from scratch.
- launchApp:
    clearState: true
    arguments:
      "-ui-testing": true
- tapOn:
    id: "today.addFirstTask"
- tapOn:
    id: "addTask.title"
- inputText: "Responder a clinica"
- tapOn:
    id: "addTask.save"
- assertVisible:
    id: "today.focusTitle"
    text: "Responder a clinica"
- tapOn:
    id: "today.startFocus"
- assertVisible:
    id: "today.timer"
