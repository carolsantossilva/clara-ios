# Análise de segurança do código (SAST) com CodeQL.
# - Swift: precisa compilar, por isso roda em macOS.
# - actions: analisa os próprios workflows (injeção de script, permissões excessivas).
# A regra da main bloqueia o merge se houver alerta de severidade alta ou maior.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.detect.outputs.app }}
      package: ${{ steps.detect.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        run: |
          echo "app=$([[ -f project.yml ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "package=$([[ -f Packages/ClaraKit/Package.swift ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  actions:
    name: Analisar workflows
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:actions

  swift:
    name: Analisar Swift
    needs: detect
    if: needs.detect.outputs.app == 'true' || needs.detect.outputs.package == 'true'
    runs-on: macos-26
    concurrency:
      group: macos-ci
      queue: max
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/install-tools.sh xcodegen
      - if: needs.detect.outputs.app == 'true'
        run: xcodegen generate
      # O rastreador ignora a compilação dos Package.swift (macOS, não é código do app):
      # extraí-la levava ~8 min. As demais compilações seguem para o extrator Swift.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        env:
          CODEQL_ACTION_EXTRA_OPTIONS: '{"database":{"init":["--extra-tracing-config=${{ github.workspace }}/.github/codeql/skip-swiftpm-manifests.lua"]}}'
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build
        env:
          APP: ${{ needs.detect.outputs.app }}
        run: |
          # Com o app: compila o projeto. Antes dele: compila só o pacote.
          # Uma arquitetura basta: o CodeQL analisa as mesmas fontes, e compilar
          # arm64 e x86_64 dobrava o tempo do build.
          if [[ "$APP" == "true" ]]; then target=(-project Clara.xcodeproj -scheme Clara); \
          else cd Packages/ClaraKit; target=(-scheme ClaraKit-Package); fi
          xcodebuild build "${target[@]}" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/dd" \
            -skipMacroValidation \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:swift
