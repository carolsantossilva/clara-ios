# Teste de mutação (Muter): introduz bugs de propósito no código e confere se
# algum teste falha. Mutante que sobrevive = teste que cobre o código mas não
# verifica nada (problema comum em testes escritos por IA).
# É lento: roda toda semana e sob demanda, não bloqueia PRs. O relatório fica
# como artefato. Experimental: o Muter não tem release desde 2023.
name: Mutação

on:
  schedule:
    - cron: "13 8 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  muter:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/install-tools.sh xcodegen
      - run: xcodegen generate
      - name: Instalar o Muter
        run: brew install muter-mutation-testing/formulae/muter
      - name: Rodar
        run: |
          mkdir -p build
          # Só a regra de negócio (ClaraCore): é onde um teste fraco custa mais caro.
          files=$(ls Packages/ClaraKit/Sources/ClaraCore/*.swift | paste -sd, -)
          muter run --skip-coverage --files-to-mutate "$files" --format html --output build/muter.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutacao
          path: build/muter.*
          retention-days: 30
