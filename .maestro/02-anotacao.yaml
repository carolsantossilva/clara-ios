appId: app.clara.ios
name: Guardar uma distração para depois
tags: [smoke]
---
- launchApp:
    clearState: true
    arguments:
      "-ui-testing": true
# O campo fica abaixo da dobra; sem rolar, o toque cairia na tab bar. Sem
# centerElement: o campo está no fim da lista, então a rolagem para antes de
# conseguir centralizá-lo e o passo falhava mesmo com o campo visível.
- scrollUntilVisible:
    element:
      id: "parking.field"
    direction: DOWN
- tapOn:
    id: "parking.field"
- inputText: "Comprar pilhas"
- tapOn:
    id: "parking.add"
# A linha é um botão: o Maestro lê o rótulo de acessibilidade, o mesmo que o VoiceOver.
- assertVisible: "Concluir: Comprar pilhas"
