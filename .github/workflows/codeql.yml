# Code security analysis (SAST) with CodeQL.
# - Swift: needs a build, so it runs on macOS.
# - actions: analyzes the workflows themselves (script injection, excessive permissions).
# The main rule blocks the merge on any alert of high severity or above.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.detect.outputs.app }}
      package: ${{ steps.detect.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        run: |
          echo "app=$([[ -f project.yml ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "package=$([[ -f Packages/ClaraKit/Package.swift ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  actions:
    name: Analyze workflows
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:actions

  swift:
    name: Analyze Swift
    needs: detect
    if: needs.detect.outputs.app == 'true' || needs.detect.outputs.package == 'true'
    runs-on: macos-26
    concurrency:
      group: macos-ci
      queue: max
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/install-tools.sh xcodegen
      - if: needs.detect.outputs.app == 'true'
        run: xcodegen generate
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build
        env:
          APP: ${{ needs.detect.outputs.app }}
        run: |
          # With the app: build the project. Before it exists: build only the package.
          if [[ "$APP" == "true" ]]; then target=(-project Clara.xcodeproj -scheme Clara); \
          else cd Packages/ClaraKit; target=(-scheme ClaraKit-Package); fi
          xcodebuild build "${target[@]}" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/dd" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:swift
